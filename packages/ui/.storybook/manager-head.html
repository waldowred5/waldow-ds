<style>
  /* Theme switch: cross-fade the Storybook UI with Tailwind's default transition (150ms),
     only while switching. Mirrors storybook.css; the class is set by theme-transition.ts. */
  .theme-switching,
  .theme-switching *,
  .theme-switching *::before,
  .theme-switching *::after {
    transition-property: color, background-color, border-color, outline-color, text-decoration-color, fill, stroke, box-shadow !important;
    transition-duration: 150ms !important;
    transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1) !important;
  }
</style>
