name: Changeset

# Reminds contributors to describe package changes. Add a changeset with
# `pnpm changeset`, or `pnpm changeset --empty` for changes that need no release.
on:
  pull_request:
    branches: [main]

jobs:
  check:
    name: Changeset present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm changeset status --since=origin/main
