name: Release

# Packages are source-only for now (not published to npm). On every merge to
# main this opens or updates a "Version Packages" PR that bumps versions and
# writes CHANGELOG.md from pending changesets. Merging that PR tags the release.
on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Version packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v2
        with:
          title: 'chore: version packages'
          commit: 'chore: version packages'
          # Source-only: tag releases instead of publishing to npm.
          publish: pnpm changeset git-tag
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
